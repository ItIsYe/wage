name: ESP32 Firmware Build & Release

on:
  push:
    branches: [beta]
    paths:
      - "wage-esp32/**"
      - ".github/workflows/esp32-firmware.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        working-directory: wage-esp32
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION="beta-${SHORT_SHA}"
          PLATFORMIO_BUILD_FLAGS="-D FIRMWARE_VERSION='\"${VERSION}\"'" pio run -e esp32dev

      - name: Determine version
        id: ver
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION="beta-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        working-directory: wage-esp32
        run: |
          mkdir -p out
          cp .pio/build/esp32dev/firmware.bin out/firmware.bin
          SHA256=$(sha256sum out/firmware.bin | cut -d' ' -f1)
          cat > out/manifest.json <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "git_commit": "${{ github.sha }}",
            "board": "esp32dev",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sha256": "${SHA256}",
            "file": "firmware.bin"
          }
          EOF
          cat out/manifest.json

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: esp32-${{ steps.ver.outputs.version }}
          name: ESP32 Firmware ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            wage-esp32/out/firmware.bin
            wage-esp32/out/manifest.json
          body: |
            Automatischer Firmware-Build vom `beta`-Branch.
            Commit: ${{ github.sha }}

      - name: Update "latest" release pointer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: esp32-latest
          name: ESP32 Firmware (latest beta)
          target_commitish: ${{ github.sha }}
          files: |
            wage-esp32/out/firmware.bin
            wage-esp32/out/manifest.json
          body: |
            Zeigt immer auf den neuesten Firmware-Build von `beta`.
            Aktuelle Version: ${{ steps.ver.outputs.version }}
            Commit: ${{ github.sha }}
