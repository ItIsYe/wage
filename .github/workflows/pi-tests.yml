name: Pi Backend Tests

on:
  push:
    branches: [beta]
    paths:
      - "pi/**"
      - ".github/workflows/pi-tests.yml"
  pull_request:
    paths:
      - "pi/**"
      - ".github/workflows/pi-tests.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten (ohne Hardware-Pakete)
        working-directory: pi
        run: pip install -r requirements-dev.txt

      - name: Syntax aller Dienste und Skripte
        working-directory: pi
        run: |
          python -m compileall -q backend common leds oled screen
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Tests
        working-directory: pi
        run: python -m pytest -q tests
