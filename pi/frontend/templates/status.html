{% extends "base.html" %}
{% block content %}
<h1>Status</h1>
<div id="msg" class="msg"></div>

<div class="card card-row">
  <div class="card-row-info">
    <b>QR-Code-Ziel</b>
    <small id="qr-url">—</small>
  </div>
</div>

<div class="card card-row">
  <div class="card-row-info">
    <b>🛠 Debug-Modus</b>
    <small>Deaktiviert den Auto-Shutdown (Power-Save bleibt aktiv)</small>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
    <span id="debug-mode-label" style="font-size:.85rem;color:var(--text-muted)">—</span>
    <button id="btn-debug-toggle" onclick="toggleDebugMode()" class="btn-secondary">Laden...</button>
  </div>
</div>

<div class="card card-row">
  <div class="card-row-info">
    <b>⏻ Pi herunterfahren</b>
    <small>Fährt den Pi sauber herunter — LEDs und OLED gehen vorher aus</small>
  </div>
  <button onclick="shutdownPi()" class="btn-danger" style="flex-shrink:0">Herunterfahren</button>
</div>

<div id="status-grid" class="grid"></div>
{% endblock %}
