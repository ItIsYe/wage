{% extends "base.html" %}
{% block content %}
<h1>Lauf erfassen</h1>
<div id="msg" class="msg"></div>

<div class="card">
  <div class="grid two">
    <div class="form-group">
      <label>Startgewicht (g) *</label>
      <input type="number" id="manual-weight" step="0.001" min="0" placeholder="z.B. 1335.286" autofocus>
    </div>
    <div class="form-group">
      <label>Zeit (ms)</label>
      <input type="number" id="manual-time-ms" min="0" value="0">
    </div>
    <div class="form-group">
      <label>Person</label>
      <select id="manual-person"></select>
    </div>
    <div class="form-group">
      <label>Datum / Uhrzeit</label>
      <input type="datetime-local" id="manual-datetime">
    </div>
    <div class="form-group">
      <label>Notiz</label>
      <input type="text" id="manual-note" placeholder="Optional">
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="manual-status">
        <option value="ok">ok</option>
        <option value="manual">manual</option>
        <option value="error">error</option>
      </select>
    </div>
  </div>
  <div class="toolbar" style="margin-top:8px">
    <button onclick="submitManualRun()" class="btn-ok">Lauf speichern</button>
    <button onclick="window.location.href='/runs'" class="btn-secondary">Abbrechen</button>
  </div>
</div>
{% endblock %}
