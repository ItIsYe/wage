{% extends "base.html" %}
{% block content %}
<h1>Waage-Konfiguration</h1>
<div id="msg" class="msg"></div>

<div class="card">
  <div class="card-row">
    <div class="card-row-info">
      <b>ESP32-Webinterface</b>
      <small id="esp-url">—</small>
    </div>
    <button onclick="reloadFrame()" class="btn-secondary">Neu laden</button>
  </div>
</div>

<div class="card">
  <h3>Firmware-Update (OTA)</h3>
  <div class="grid two">
    <div class="form-group">
      <label>Aktuelle Firmware</label>
      <div style="font-family:monospace;padding:4px 0" id="ota-current">—</div>
    </div>
    <div class="form-group">
      <label>Verfügbare Firmware</label>
      <div style="font-family:monospace;padding:4px 0" id="ota-available">—</div>
    </div>
  </div>
  <div class="form-group">
    <label>Status</label>
    <div id="ota-status">—</div>
  </div>
  <div id="ota-progress-wrap" style="display:none;margin-bottom:14px">
    <div class="progress"><div id="ota-progress-bar" class="progress-bar" style="width:0%"></div></div>
    <div style="font-size:.8rem;color:var(--text-muted);margin-top:4px"><span id="ota-progress-pct">0</span>%</div>
  </div>
  <div class="toolbar">
    <button id="btn-ota-check" onclick="otaCheck()">Auf Update prüfen</button>
    <button id="btn-ota-apply" onclick="otaApply()" disabled>Update installieren</button>
    <button id="btn-ota-sync" onclick="otaSync()" class="btn-secondary">Von GitHub laden</button>
  </div>
  <p class="hint">Während des Updates nicht vom Strom trennen. Das Gerät startet nach dem Update automatisch neu.</p>
</div>

<div style="position:relative;width:100%;height:70vh;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--bg-card);margin-top:16px">
  <div id="esp-frame-loading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.1em;color:var(--text-muted)">Lade ESP-Webinterface...</div>
  <iframe id="esp-frame" src="" style="width:100%;height:100%;border:none;display:none" onload="onFrameLoad()"></iframe>
</div>
{% endblock %}
