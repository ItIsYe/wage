{% extends "base.html" %}
{% block content %}
<h1>Firmware-Update (OTA)</h1>
<div id="msg" class="msg"></div>

<div class="card">
  <div class="grid two">
    <div class="form-group">
      <label>Aktuelle ESP-Firmware</label>
      <div style="font-family:monospace;padding:9px 0" id="ota-current">—</div>
    </div>
    <div class="form-group">
      <label>Verfügbare Firmware</label>
      <div style="font-family:monospace;padding:9px 0" id="ota-available">—</div>
    </div>
  </div>

  <div class="form-group">
    <label>Status</label>
    <div id="ota-status" style="padding:4px 0">—</div>
  </div>

  <div id="ota-progress-wrap" style="display:none;margin-bottom:14px">
    <div class="progress"><div id="ota-progress-bar" class="progress-bar" style="width:0%"></div></div>
    <div style="font-size:.8rem;color:var(--text-muted);margin-top:4px"><span id="ota-progress-pct">0</span>%</div>
  </div>

  <div class="toolbar">
    <button id="btn-ota-check" onclick="otaCheck()">Auf Update prüfen</button>
    <button id="btn-ota-apply" onclick="otaApply()" disabled>Update installieren</button>
    <button id="btn-ota-sync" onclick="otaSync()" class="btn-secondary">Von GitHub laden</button>
  </div>
  <p class="hint">Während des Updates nicht vom Strom trennen. Das Gerät startet nach dem Update automatisch neu.</p>
</div>
{% endblock %}
