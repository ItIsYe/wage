{% extends "base.html" %}
{% block content %}
<h1>Firmware-Update (OTA)</h1>
<div id="msg" class="msg"></div>

<div class="card">
  <p>Aktuelle ESP-Firmware: <strong id="ota-current">-</strong></p>
  <p>Verfügbare Firmware: <strong id="ota-available">-</strong></p>
  <p>Status: <span id="ota-status">-</span></p>
  <div id="ota-progress-wrap" style="display:none;margin:8px 0;">
    <div style="background:#e0e0e0;border-radius:6px;height:14px;overflow:hidden;">
      <div id="ota-progress-bar" style="height:100%;background:#2563eb;width:0%;transition:width .4s;border-radius:6px;"></div>
    </div>
    <span id="ota-progress-pct">0%</span>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
    <button id="btn-ota-check" onclick="otaCheck()">Auf Update prüfen</button>
    <button id="btn-ota-apply" onclick="otaApply()" disabled>Update installieren</button>
    <button id="btn-ota-sync" onclick="otaSync()">Firmware von GitHub laden</button>
  </div>
  <p style="margin-top:8px;font-size:0.85em;color:#a33;">Während des Updates nicht vom Strom trennen. Das Gerät startet nach dem Update automatisch neu.</p>
</div>
{% endblock %}
