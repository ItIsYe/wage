{% extends "base.html" %}
{% block content %}
<h1>Läufe</h1>
<div id="msg" class="msg"></div>

<div class="toolbar">
  <button onclick="window.location.href='/runs/new'" class="btn-ok">+ Lauf erfassen</button>
  <a href="/api/v1/runs/export/csv" download>
    <button class="btn-secondary">↓ CSV</button>
  </a>
  <input id="search" placeholder="Suche..." style="flex:1;min-width:160px">
  <select id="person-filter" style="width:auto"></select>
  <select id="status-filter" style="width:auto">
    <option value="">Alle Status</option>
    <option value="ok">ok</option>
    <option value="error">error</option>
  </select>
  <select id="sort" style="width:auto">
    <option value="id_desc">Neueste zuerst</option>
    <option value="id_asc">Älteste zuerst</option>
    <option value="time_desc">Zeit ↓</option>
    <option value="time_asc">Zeit ↑</option>
  </select>
  <input id="limit" type="number" min="1" max="500" value="100" style="width:70px">
  <button onclick="loadRuns()" class="btn-secondary">Laden</button>
</div>

<div style="overflow:auto">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Nr.</th><th>Zeit (ms)</th><th>Gewicht (g)</th>
        <th>Person</th><th>Datum</th><th>Status</th><th>Notiz</th><th></th>
      </tr>
    </thead>
    <tbody id="runs-body"></tbody>
  </table>
</div>
{% endblock %}
