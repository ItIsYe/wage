[platformio]
; Ohne default_envs bauen 'pio run' und 'pio run -t upload' ALLE Umgebungen, auch 'native' (Host-Tests,
; kein main) und esp32dev-ota.
default_envs = esp32dev

[env:esp32dev]
; Fest gepinnt auf den Stand des letzten erfolgreichen CI-Builds (Arduino-Core 2.0.17).
; Ohne Pin zieht PlatformIO die jeweils neueste Plattform; mit dem neueren Core passt
; die Firmware nicht mehr in die Standard-OTA-Partition (1310720 Bytes).
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D FASTLED_INTERRUPT_RETRY_COUNT=8

lib_deps =
  bogde/HX711 @ 0.7.5
  adafruit/Adafruit GFX Library @ 1.12.6
  adafruit/Adafruit SH110X @ 2.1.15
  fastled/FastLED @ 3.7.0   ; Stabil für WS2812B auf ESP32 mit WiFi

; OTA-Upload per WLAN (PlatformIO -> ESP direkt):
; pio run -e esp32dev-ota -t upload
; Voraussetzung: ESP läuft mit ArduinoOTA, PC im selben Netz (192.168.50.x)
; Build: 2
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.50.100   ; statische IP des ESP
upload_flags = --auth=wagefirmware

; Host-Tests ohne Hardware:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I test/stubs -I include
build_src_filter = -<*> +<run_module.cpp> +<external_interface_module.cpp>
test_build_src = yes
